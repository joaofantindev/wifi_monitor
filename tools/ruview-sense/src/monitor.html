<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ruview-sense — monitor</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --amber: #d29922;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 24px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .source { font-weight: 600; padding: 2px 10px; border-radius: 999px; font-size: 13px; }
    .source.live { background: rgba(63,185,80,.15); color: var(--green); }
    .source.simulated { background: rgba(242,81,73,.15); color: var(--red); }
    .source.rssi { background: rgba(210,153,34,.15); color: var(--amber); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid #21262d; border-radius: 10px; padding: 14px 16px; }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }
    .info { color: var(--blue); }
    .muted { color: var(--muted); font-size: 12px; }
    .note { margin-top: 16px; padding: 10px 12px; border-left: 3px solid var(--amber); background: #1c2128; font-size: 12px; color: var(--muted); }
    #conn { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <h1>ruview-sense</h1>
      <div class="muted">presença / movimento / contagem / vitais (heurísticas rotuladas)</div>
    </div>
    <div style="text-align:right">
      <span id="source" class="source">…</span><br>
      <span id="conn">conectando…</span>
    </div>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Presença</div><div id="presence" class="value muted">—</div><div id="presenceScore" class="muted"></div></div>
    <div class="card"><div class="label">Movimento</div><div id="motion" class="value muted">—</div><div id="motionEnergy" class="muted"></div></div>
    <div class="card"><div class="label">Pessoas (heurística)</div><div id="persons" class="value muted">—</div><div id="personsGrade" class="muted"></div></div>
    <div class="card"><div class="label">Mudança no ambiente</div><div id="env" class="value muted">—</div><div class="muted">objeto movido/novo? (não classifica)</div></div>
    <div class="card"><div class="label">Respiração (BPM)</div><div id="breathing" class="value muted">—</div><div id="breathingGrade" class="muted"></div></div>
    <div class="card"><div class="label">Batimentos (BPM)</div><div id="heart" class="value muted">—</div><div id="heartGrade" class="muted"></div></div>
    <div class="card"><div class="label">RSSI (dBm)</div><div id="rssi" class="value muted">—</div></div>
    <div class="card"><div class="label">Frames recebidos</div><div id="frames" class="value muted">0</div></div>
  </div>

  <div class="note" id="note"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (v, d = 2) => (v === null || v === undefined) ? "—" : Number(v).toFixed?.(d) ?? v;

    function gradeBadge(g) {
      if (!g) return "";
      const cls = g.includes("device-reported") ? "info" : g.includes("estimated") || g.includes("heuristic") ? "warn" : "muted";
      return `<span class="${cls} muted">${g}</span>`;
    }

    const es = new EventSource("/events");
    es.onmessage = (e) => {
      const s = JSON.parse(e.data);
      const live = s.source === "esp32";
      const sim = s.source === "simulated";
      const rssi = s.source === "rssi";

      $("source").textContent = { esp32: "LIVE · ESP32 CSI", simulated: "SIMULATED DATA", rssi: "RSSI (grosseiro)" }[s.source] ?? s.source;
      $("source").className = "source " + (live ? "live" : sim ? "simulated" : rssi ? "rssi" : "");

      $("presence").textContent = s.present ? "SIM" : "NÃO";
      $("presence").className = "value " + (s.present ? "ok" : "muted");
      $("presenceScore").textContent = "score " + fmt(s.presenceScore, 3);

      $("motion").textContent = s.motion ? "SIM" : "NÃO";
      $("motion").className = "value " + (s.motion ? "warn" : "muted");
      $("motionEnergy").textContent = "energia " + fmt(s.motionEnergy, 4);

      $("persons").textContent = s.persons ?? "—";
      $("personsGrade").innerHTML = gradeBadge(s.personsGrade);

      $("env").textContent = s.environmentChanged ? "MUDOU" : "estável";
      $("env").className = "value " + (s.environmentChanged ? "bad" : "muted");

      const v = s.vitals;
      $("breathing").textContent = v && v.breathingBpm != null ? fmt(v.breathingBpm, 1) : "—";
      $("breathingGrade").innerHTML = gradeBadge(v && v.grade);
      $("heart").textContent = v && v.heartBpm != null ? fmt(v.heartBpm, 1) : "—";
      $("heartGrade").innerHTML = gradeBadge(v && v.grade);

      $("rssi").textContent = s.rssiDbm != null ? s.rssiDbm + " · " + (s.bssids ?? 1) + " pontos" : "—";
      $("frames").textContent = s.frames ?? 0;
    };
    es.onopen = () => { $("conn").textContent = "conectado"; $("conn").style.color = "var(--green)"; };
    es.onerror = () => { $("conn").textContent = "reconectando…"; $("conn").style.color = "var(--amber)"; };

    $("note").innerHTML =
      "<b>Leia com honestidade:</b> contagem é <b>heurística</b> (diversidade de subportadoras, não pessoas reais); " +
      "vitais do pacote ESP32 são <i>device-reported, não validados</i>, e a estimativa local é heurística; " +
      "RSSI (sem ESP32) só dá presença/movimento grosseiros; mudança de ambiente não classifica o objeto.";
  </script>
</body>
</html>
